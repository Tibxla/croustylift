# CI : garde le code vert sur chaque push / PR (lint + tests + build, qui inclut
# le typecheck, + budget de taille du bundle). Sur `main`, le déploiement en
# production part d'ici, APRÈS ce contrôle : le déploiement automatique de Vercel
# est coupé pour `main` (`git.deploymentEnabled` dans vercel.json), une CI rouge
# ne déploie donc rien.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le workflow ne fait que lire le dépôt : le jeton n'a pas d'autre droit.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Les modules data/* importent src/lib/supabase.ts, qui exige VITE_SUPABASE_* dès
    # l'import (sinon il throw). Les tests mockent le réseau et le build n'établit
    # aucune connexion : des valeurs FACTICES suffisent à instancier le client. La
    # vraie config (clé publishable) vit côté Vercel, jamais ici.
    env:
      VITE_SUPABASE_URL: https://dummy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_ci_not_a_secret
    steps:
      # Actions épinglées par SHA de commit : un tag se déplace, un SHA non.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `--max-warnings` est dans le script `lint` (package.json) : un warning de
      # plus que le niveau connu fait échouer la CI.
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      # Budget gzip par chunk (scripts/bundle-size.mjs).
      - run: npm run size

  deploy:
    # Production seulement depuis main, et seulement si `check` est vert.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # Deux pushes rapprochés : le second attend, aucun déploiement en parallèle.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    # Jeton Vercel limité au projet croustylift (un an, créé le 2026-11-24) ;
    # la vraie config Supabase (variables publiques) est tirée de Vercel.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --yes vercel@66.6.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@66.6.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@66.6.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
